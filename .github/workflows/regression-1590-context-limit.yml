name: Regression 1590 Context Limit

on:
  push:
    branches:
      - first-red/1590-context-limit-overflow
    paths:
      - ".github/workflows/regression-1590-context-limit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repaired source is frozen
        run: |
          ACTUAL=$(git hash-object source/utils/parse-context-limit.ts)
          echo "Expected source blob: 8ab2490f1176701aaaa8fd9b52c3aa5fb6cbbd5f"
          echo "Observed source blob: $ACTUAL"
          test "$ACTUAL" = "8ab2490f1176701aaaa8fd9b52c3aa5fb6cbbd5f"

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository regression suite
        run: pnpm test:all
